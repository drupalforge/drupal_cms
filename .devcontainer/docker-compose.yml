include:
  - base/docker-compose.db.yml

services:
  app:
    extends:
      file: base/docker-compose.app.yml
      service: app
    image: drupalforge/drupal_cms:main
    depends_on:
      init-source-code:
        condition: service_completed_successfully

  init-source-code:
    extends:
      file: base/docker-compose.app.yml
      service: init-source-code
    image: drupalforge/drupal_cms:main
