name: Docker build and push template
on:
  push:
    branches:
      - "main"
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
permissions:
  actions: write
  packages: write
jobs:
  build-application:
    uses: drupalforge/docker_publish_action/.github/workflows/docker-publish.yml@main
    with:
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      base_image: devpanel/php:8.5-base
    secrets:
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      init_env: ${{ format('{{"DP_AI_VIRTUAL_KEY":{0}}}', toJSON(secrets.DP_AI_VIRTUAL_KEY)) }}

  get-templates:
    runs-on: ubuntu-latest
    outputs:
      free_templates: ${{ steps.fetch.outputs.free_templates }}
      paid_templates: ${{ steps.fetch.outputs.paid_templates }}
    steps:
      - name: Fetch and parse template list from Drupal CMS
        id: fetch
        run: |
          YAML_URL="https://git.drupalcode.org/api/v4/projects/204857/repository/files/site-templates.yml/raw?ref=HEAD"
          YAML_CONTENT=$(curl -sf --max-time 30 "$YAML_URL") || {
            echo "::error::Failed to fetch site-templates.yml from $YAML_URL"
            exit 1
          }
          cat > /tmp/parse_templates.py << 'PYEOF'
          import sys, json, yaml
          d = yaml.safe_load(sys.stdin.read())
          if isinstance(d, dict):
              free = []
              paid = []
              for template_id, metadata in d.items():
                  item = {
                      'id': template_id,
                      'name': (metadata.get('name') or '') if isinstance(metadata, dict) else '',
                  }
                  if isinstance(metadata, dict) and metadata.get('purchase'):
                      paid.append(item)
                  else:
                      free.append(item)
          elif isinstance(d, list):
              free = [{'id': str(x), 'name': ''} for x in d]
              paid = []
          else:
              sys.exit('Unexpected YAML structure')
          print(json.dumps({'free': free, 'paid': paid}))
          PYEOF
          RESULT=$(echo "$YAML_CONTENT" | python3 /tmp/parse_templates.py)
          echo "free_templates=$(echo "$RESULT" | jq -c '.free')" >> "$GITHUB_OUTPUT"
          echo "paid_templates=$(echo "$RESULT" | jq -c '.paid')" >> "$GITHUB_OUTPUT"

  build-free-template-images:
    needs: get-templates
    if: needs.get-templates.outputs.free_templates != '[]'
    strategy:
      matrix:
        template: ${{ fromJson(needs.get-templates.outputs.free_templates) }}
      fail-fast: false
    # Each free template is published as drupalforge/<template-id>:main on Docker Hub.
    # Pass the selected template through init_env, matching the paid-template job.
    uses: drupalforge/docker_publish_action/.github/workflows/docker-publish.yml@main
    with:
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      base_image: devpanel/php:8.5-base
      image_repo: "drupalforge/${{ matrix.template.id }}"
    secrets:
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      init_env: ${{ format('{{"DP_AI_VIRTUAL_KEY":{0},"DRUPAL_CMS_SITE_TEMPLATE":{1},"SITE_NAME":{2}}}', toJSON(secrets.DP_AI_VIRTUAL_KEY), toJSON(matrix.template.id), toJSON(matrix.template.name)) }}

  build-paid-template-images:
    needs: get-templates
    if: needs.get-templates.outputs.paid_templates != '[]'
    strategy:
      matrix:
        template: ${{ fromJson(needs.get-templates.outputs.paid_templates) }}
      fail-fast: false
    # Paid template images use private GHCR packages and need Composer credentials.
    uses: drupalforge/docker_publish_action/.github/workflows/docker-publish.yml@main
    with:
      base_image: devpanel/php:8.5-base
      image_repo: "drupalforge/${{ matrix.template.id }}"
    secrets:
      init_env: ${{ format('{{"DP_AI_VIRTUAL_KEY":{0},"COMPOSER_AUTH":{1},"DRUPAL_CMS_SITE_TEMPLATE":{2},"SITE_NAME":{3}}}', toJSON(secrets.DP_AI_VIRTUAL_KEY), toJSON(secrets.COMPOSER_AUTH), toJSON(matrix.template.id), toJSON(matrix.template.name)) }}
