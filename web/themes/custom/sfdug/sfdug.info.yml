name: SFDUG
type: theme
description: 'San Francisco Drupal Users Group — cream, purple and gold. Meeting monthly since 2006.'
package: Custom
core_version_requirement: ^11
base theme: stable9

libraries:
  - sfdug/global

libraries-override:
  core/normalize: false

logo: images/sfdug-logo.jpg

regions:
