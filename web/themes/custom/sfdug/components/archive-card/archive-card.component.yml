$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Archive card
status: stable
description: 'An older session. Falls back to a deterministic gradient plate when there is no thumbnail,
  which is how the prototype rendered every archive entry.

  '
props:
  type: object
  required:
  - title
  properties:
    title:
      type: string
    date:
      type:
      - string
      - 'null'
    speaker:
      type:
      - string
      - 'null'
    url:
      type:
      - string
      - 'null'
    thumbnail:
      type:
      - string
      - 'null'
    gradient:
      type:
      - string
      - 'null'
    external:
      type:
      - boolean
      - 'null'
      default: false
