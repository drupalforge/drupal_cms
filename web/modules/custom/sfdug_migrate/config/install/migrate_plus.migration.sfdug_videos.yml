id: sfdug_videos
label: 'SFDUG recordings'
migration_group: sfdug
migration_tags:
  - sfdug
source:
  plugin: csv
  path: /var/www/html/web/modules/custom/sfdug_migrate/data/videos.csv
  header_offset: 0
  ids:
    - media_id
process:
  name: name
  field_media_oembed_video: url
  created: created
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:media'
  default_bundle: remote_video
